<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ohm Calculator</title>

<style>

body{
    margin:0;
    font-family:Arial;
    background:#111;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.box{
    width:90%;
    max-width:500px;
    background:#1e1e1e;
    padding:25px;
    border-radius:20px;
    box-shadow:0 0 30px rgba(0,0,0,0.5);
}

h1{
    text-align:center;
    margin-bottom:30px;
}

.row{
    margin-bottom:25px;
}

.label{
    display:flex;
    justify-content:space-between;
    margin-bottom:10px;
    font-size:18px;
}

input[type=range]{
    width:100%;
    height:10px;
}

.result{
    background:#151515;
    padding:20px;
    border-radius:15px;
    margin-top:20px;
}

.result div{
    margin:10px 0;
    font-size:22px;
}

.big{
    font-size:34px;
    font-weight:bold;
    color:#00ff88;
}

footer{
    margin-top:20px;
    text-align:center;
    opacity:0.5;
    font-size:12px;
}

</style>
</head>
<body>

<div class="box">

<h1>⚡ Ohm Calculator</h1>

<div class="row">
    <div class="label">
        <span>Voltage</span>
        <span id="vtext">12V</span>
    </div>

    <input type="range" id="v" min="1" max="60" value="12">
</div>

<div class="row">
    <div class="label">
        <span>Resistance</span>
        <span id="rtext">10Ω</span>
    </div>

    <input type="range" id="r" min="1" max="100" value="10">
</div>

<div class="result">

    <div>
        Current:
        <span class="big" id="current">0</span>
    </div>

    <div>
        Power:
        <span class="big" id="power">0</span>
    </div>

</div>

<footer>
Ohm's Law Calculator
</footer>

</div>

<script>

function update(){

    let v = Number(document.getElementById("v").value);
    let r = Number(document.getElementById("r").value);

    let current = v / r;
    let power = v * current;

    document.getElementById("vtext").innerText =
        v + "V";

    document.getElementById("rtext").innerText =
        r + "Ω";

    document.getElementById("current").innerText =
        current.toFixed(2) + " A";

    document.getElementById("power").innerText =
        power.toFixed(2) + " W";
}

document.getElementById("v").oninput = update;
document.getElementById("r").oninput = update;

update();

</script>

</body>
</html>
