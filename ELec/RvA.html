<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RvA Calculator</title>

<meta name="theme-color" content="#00ff88">

<meta property="og:title" content="RvA Calculator">
<meta property="og:description" content="Voltage Drop Resistor Calculator">
<meta property="og:type" content="website">

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
background:#0f0f0f;
font-family:Arial;
color:white;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
}

.box{
width:100%;
max-width:650px;
background:#1b1b1b;
padding:25px;
border-radius:25px;
box-shadow:0 0 30px rgba(0,0,0,.5);
}

.top{
display:flex;
justify-content:space-between;
gap:10px;
margin-bottom:20px;
flex-wrap:wrap;
}

.btn{
background:#00ff88;
color:black;
border:none;
padding:10px 16px;
border-radius:12px;
font-weight:bold;
cursor:pointer;
text-decoration:none;
}

h1{
text-align:center;
margin-top:5px;
margin-bottom:30px;
font-size:32px;
}

.row{
margin-bottom:28px;
}

.label{
display:flex;
justify-content:space-between;
margin-bottom:10px;
font-size:18px;
}

input[type=range]{
width:100%;
height:12px;
}

.result{
background:#111;
padding:20px;
border-radius:18px;
}

.resultBox{
margin-bottom:20px;
}

.big{
font-size:34px;
font-weight:bold;
color:#00ff88;
word-break:break-word;
}

.info{
opacity:.7;
font-size:14px;
margin-top:5px;
}

footer{
margin-top:25px;
text-align:center;
opacity:.5;
font-size:13px;
}

@media(max-width:600px){

h1{
font-size:24px;
}

.big{
font-size:26px;
}

}

</style>

</head>

<body>

<div class="box">

<div class="top">

<a class="btn"
href="./README.md">
README
</a>

<button class="btn"
onclick="toggleLang()">
TH / EN
</button>

</div>

<h1 id="title">
⚡ Voltage Drop Calculator
</h1>

<div class="row">

<div class="label">
<span id="vinlabel">Input Voltage</span>
<span id="vintext">12V</span>
</div>

<input
type="range"
id="vin"
min="1"
max="100"
value="12"
step="0.1">

</div>

<div class="row">

<div class="label">
<span id="voutlabel">Output Voltage</span>
<span id="vouttext">5V</span>
</div>

<input
type="range"
id="vout"
min="1"
max="100"
value="5"
step="0.1">

</div>

<div class="row">

<div class="label">
<span id="ilabel">Current</span>
<span id="itext">1A</span>
</div>

<input
type="range"
id="i"
min="0.1"
max="20"
value="1"
step="0.1">

</div>

<div class="result">

<div class="resultBox">

<div id="rlabel">
Required Resistance
</div>

<div class="big"
id="rvalue">
0 Ω
</div>

<div class="info">
R = (Vin - Vout) / I
</div>

</div>

<div class="resultBox">

<div id="plabel">
Power Dissipation
</div>

<div class="big"
id="pvalue">
0 W
</div>

<div class="info">
Heat generated by resistor
</div>

</div>

<div class="resultBox">

<div id="wlabel">
Recommended Watt
</div>

<div class="big"
id="wvalue">
0 W
</div>

<div class="info">
Use resistor watt x2 minimum
</div>

</div>

</div>

<footer>
Ohm Law / Voltage Drop / Resistor Tool
</footer>

</div>

<script>

let thai = false;

function toggleLang(){

thai = !thai;

if(thai){

title.innerText =
"⚡ คำนวณตัวต้านทานลดแรงดัน";

vinlabel.innerText =
"แรงดันไฟเข้า";

voutlabel.innerText =
"แรงดันที่ต้องการ";

ilabel.innerText =
"กระแส";

rlabel.innerText =
"ค่าความต้านทาน";

plabel.innerText =
"กำลังไฟสูญเสีย";

wlabel.innerText =
"วัตต์แนะนำ";

}else{

title.innerText =
"⚡ Voltage Drop Calculator";

vinlabel.innerText =
"Input Voltage";

voutlabel.innerText =
"Output Voltage";

ilabel.innerText =
"Current";

rlabel.innerText =
"Required Resistance";

plabel.innerText =
"Power Dissipation";

wlabel.innerText =
"Recommended Watt";

}

}

function update(){

let vin =
Number(document.getElementById("vin").value);

let vout =
Number(document.getElementById("vout").value);

let i =
Number(document.getElementById("i").value);

let r =
(vin - vout) / i;

let p =
(vin - vout) * i;

let w =
p * 2;

if(vout >= vin){

r = 0;
p = 0;
w = 0;

}

vintext.innerText =
vin.toFixed(1) + "V";

vouttext.innerText =
vout.toFixed(1) + "V";

itext.innerText =
i.toFixed(1) + "A";

rvalue.innerText =
r.toFixed(2) + " Ω";

pvalue.innerText =
p.toFixed(2) + " W";

wvalue.innerText =
w.toFixed(2) + " W";

}

vin.oninput = update;
vout.oninput = update;
i.oninput = update;

update();

</script>

</body>
</html>
